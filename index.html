<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Instagram紹介</title>

<!-- 丸いフォント -->
<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap"
rel="stylesheet">

<style>

/* 全体 */

body{

  margin:0;

  background：＃FBFFF7;

  font-family:
  'Zen Maru Gothic',
  sans-serif;

  color:#9b857d;

  text-align:center;

  overflow-x:hidden;

}
  
/* 余白 */

.container{

  padding:
  50px 25px 80px;

}

/* キャラ */

.character{

  width:220px;

  margin-top:20px;

}

/* タイトル */

.title{

  font-size:58px;

  font-weight:700;

  line-height:1.2;

  margin-top:20px;

}

.red{
  color:#ef7366;
}

.green{
  color:#69c06e;
}

/* 英語 */

.sub{

  margin-top:18px;

  letter-spacing:5px;

  color:#b9aaa2;

  font-size:18px;

}

/* 線 */

.line{

  width:85%;

  height:1px;

  background:#d8ccc5;

  margin:50px auto;

  position:relative;

}

.line::after{

  content:"";

  width:14px;

  height:14px;

  background:#d8ccc5;

  border-radius:50%;

  position:absolute;

  left:50%;

  top:50%;

  transform:
  translate(-50%,-50%);

}

/* 説明 */

.text{

  font-size:18px;

  line-height:2;

  margin-top:20px;

}

/* インスタ見出し */

.insta-title{

  font-size:22px;

  font-weight:bold;

  margin-top:70px;

}

/* ボックス */

.insta-box{

  width:88%;

  margin:35px auto;

  background:white;

  border-radius:35px;

  padding:30px 20px;

  box-shadow:
  0 10px 30px
  rgba(0,0,0,0.06);

  border:
  2px solid #f0d1d1;

}

/* ロゴ */

.insta-logo{

  width:90px;

}

/* ID */

.account{

  margin-top:20px;

  font-size:32px;

  font-weight:bold;

}

/* 小文字 */

.small{

  margin-top:10px;

  font-size:16px;

}

/* 下文字 */

.bottom{

  margin-top:70px;

  font-size:20px;

}

/* 矢印 */

.arrow{

  margin-top:20px;

  font-size:50px;

  color:#6bc170;

}

/* リンク */

a{

  text-decoration:none;

  color:inherit;

}

/* ================= */
/* フワッと表示 */
/* ================= */

.fade{

  opacity:0;

  transform:
  translateY(30px);

  animation:
  fadeUp 1s ease forwards;

}

/* 遅延 */

.delay1{
  animation-delay:0.3s;
}

.delay2{
  animation-delay:0.6s;
}

.delay3{
  animation-delay:0.9s;
}

.delay4{
  animation-delay:1.2s;
}

.delay5{
  animation-delay:1.5s;
}

/* アニメ */

@keyframes fadeUp{

  to{

    opacity:1;

    transform:
    translateY(0);

  }

}

</style>
</head>

<body>

<div class="container">

  <!-- キャラ -->
  <img class="character fade"
  src="IMG_9852.PNG">

  <!-- タイトル -->
  <div class="title fade delay1">

    <span class="red">ようこそ！</span>


  </div>

  <!-- 英語 -->
  <div class="sub fade delay2">
    SOCIAL BEAR HOME
  </div>

  <!-- 線 -->
  <div class="line fade delay2"></div>

  <!-- 説明 -->
  <div class="text fade delay3">

    スキャンありがとう！<br>

    ぜひInstagramをフォローしてね


  </div>

  <!-- インスタ -->
  <div class="insta-title fade delay4">

    インスタグラムはこちら

  </div>

  <!-- ボタン -->
  <a href="https://instagram.com/konishi__brotherz">

    <div class="insta-box fade delay5">

      <img class="insta-logo"

      src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">

      <div class="account">
        @konishi__brotherz
       
      </div>

      <div class="small">

        独創的な世界観を表現する<br>
        
        クリエイティブ集団

      </div>

    </div>

  </a>

  <!-- 下 -->
  <div class="bottom fade delay5">

    見に来てくれてありがとう！

  </div>

  <div class="arrow fade delay5">
    Coming soon...
  </div>

</div>

</body>
</html>
