<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram紹介</title>

<style>

body{
  margin:0;
  background:linear-gradient(#f6f0e9,#f7f5f2);
  font-family:sans-serif;
  text-align:center;
  color:#8f7f78;
}

/* 上余白 */
.top{
  padding-top:50px;
}

/* キャラクター画像 */
.character{
  width:220px;
}

/* タイトル */
.title{
  font-size:60px;
  font-weight:bold;
  margin-top:30px;
  line-height:1.2;
}

/* 色 */
.red{
  color:#ef6a5b;
}

.green{
  color:#63b96d;
}

/* 英語 */
.sub{
  letter-spacing:5px;
  margin-top:20px;
  color:#b9aaa2;
}

/* 説明文 */
.text{
  margin:60px 30px;
  font-size:24px;
  line-height:1.8;
}

/* インスタボタン */
.insta-box{

  width:85%;
  margin:50px auto;

  background:white;

  border-radius:30px;

  padding:30px;

  box-shadow:0 5px 20px rgba(0,0,0,0.08);

}

/* ロゴ */
.insta-logo{
  width:100px;
}

/* ボタンリンク */
a{
  text-decoration:none;
  color:inherit;
}

.account{
  font-size:40px;
  font-weight:bold;
  margin-top:20px;
}

.small{
  margin-top:10px;
  font-size:20px;
}

</style>
</head>

<body>

<div class="top">

  <!-- キャラ画像 -->
  <img class="character" src="IMG_9852.PNG">
  <img class="fade" src="IMG_9852.PNG" width="300">

  <!-- タイトル -->
  <div class="title">
    <span class="green">ようこそ！</span>

  </div>

  <!-- 英語 -->
  <div class="sub">
    SORCIAL BEAR HOME
  </div>

  <!-- 説明 -->
  <div class="text">
    スキャンありがとう！<br>
    Instagramをぜひフォローしてね
  </div>

</div>

<!-- Instagramリンク -->
<a href="https://.instagram.com/@konishi__brotherz">

<div class="insta-box">

  <img class="insta-logo"
  src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">

  <div class="account">
    @konishi__brotherz
  </div>

  <div class="small">
    タップしてInstagramへ
  </div>

</div>

</a>

</body>
</html>
